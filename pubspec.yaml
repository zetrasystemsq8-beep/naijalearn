name: naijalearn
description: "NaijaLearn - JAMB & WAEC CBT Practice"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.2
  provider: ^6.1.2

  # ZetraMail Authentication
  flutter_dotenv: ^5.1.0
  supabase_flutter: ^2.5.6

  # Notifications
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1

  # App info & external links
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
