name: Generate Release Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore naijalearn-release.keystore \
            -storetype JKS -keyalg RSA -keysize 2048 -validity 10000 \
            -alias naijalearn \
            -storepass NaijaLearn2026Secure \
            -keypass NaijaLearn2026Secure \
            -dname "CN=NaijaLearn, OU=Zetra, O=Zetra Store, L=Lagos, S=Lagos, C=NG"

      - name: Base64 encode keystore
        run: base64 -w 0 naijalearn-release.keystore > keystore_base64.txt

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: keystore-files
          path: |
            naijalearn-release.keystore
            keystore_base64.txt
          retention-days: 5
